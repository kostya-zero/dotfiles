git:
  diffRenderers:
    - command: delta --dark --syntax-theme=ansi --paging=never
gui:
  mouseEvents: false
  scrollHeight: 20
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - '#cecece'
      - bold
    inactiveBorderColor:
      - '#3a3a3a'
    searchingActiveBorderColor:
      - '#cecece'
      - bold
    optionsTextColor:
      - '#ed756e'
    selectedLineBgColor:
      - '#2e2e2e'
    inactiveViewSelectedLineBgColor:
      - '#222222'
    cherryPickedCommitFgColor:
      - '#ed756e'
    cherryPickedCommitBgColor:
      - '#3ba6f5'
    markedBaseCommitFgColor:
      - '#ed756e'
    markedBaseCommitBgColor:
      - '#c39900'
    unstagedChangesColor:
      - '#ed756e'
    defaultFgColor:
      - '#cecece'
  authorColors:
    '*': '#968ff7'
