set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# rebind action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on
set-option -g base-index 1
set-option -g set-titles on
set-option -g set-titles-string '#{pane_title}'
# set-option -g default-client-command 'new-session -A -s "#(basename "$PWD")"'

# keybinds
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
bind-key S command-prompt -I '#S' 'rename-session "%%"'
bind-key W command-prompt -I '#W' 'rename-window "%%"'

# minimal status bar
set-option -g status-justify centre
set-option -g status-style 'bg=default,fg=#839496'
set-option -g status-left '#[fg=#2aa198] #S '
set-option -g status-left-length 40
set-option -g status-right '#[fg=#93a1a1] %H:%M '
set-option -g status-right-length 10
set-option -g window-status-format '#[fg=#586e75] #I:#W '
set-option -g window-status-current-format '#[fg=#b58900,bold] #I:#W '

# Solarized Dark UI
set-option -g pane-border-style 'fg=#586e75'
set-option -g pane-active-border-style 'fg=#268bd2'
set-option -g message-style 'bg=#073642,fg=#93a1a1'
set-option -g message-command-style 'bg=#073642,fg=#93a1a1'
set-option -g mode-style 'bg=#073642,fg=#93a1a1'
set-option -g display-panes-colour '#586e75'
set-option -g display-panes-active-colour '#b58900'
set-option -g clock-mode-colour '#2aa198'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize tpm
run '~/.tmux/plugins/tpm/tpm'
